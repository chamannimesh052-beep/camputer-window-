<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAMAN PHOTO BOOK MAKER</title>
<style>
body{background:#111;color:#fff;font-family:system-ui;text-align:center;padding:20px}
.book{width:90%;max-width:800px;height:500px;margin:20px auto;background:#fff;color:#000;display:flex;box-shadow:0 10px 40px rgba(0,0,0,.8);border-radius:10px;overflow:hidden}
.page{flex:1;padding:10px;display:flex;align-items:center;justify-content:center;background:#fdf6e3;border-right:1px solid #ddd}
.page img{max-width:100%;max-height:100%;border-radius:6px}
.upload{background:linear-gradient(135deg,#6a00ff,#ff006a);padding:14px 20px;border-radius:10px;color:#fff;border:none;font-weight:700;cursor:pointer}
.controls{margin-top:20px}
</style>
</head>
<body>
<h1>📚 CHAMAN PHOTO BOOK MAKER</h1>
<label class="upload" for="upload">📸 Photos Se Book Banao</label>
<input type="file" id="upload" accept="image/*" multiple hidden>

<div class="book" id="book">
<div class="page" id="page1">Cover Page</div>
<div class="page" id="page2">Upload photos</div>
</div>

<div class="controls">
<button class="upload" onclick="prevPage()">⬅ Prev</button>
<button class="upload" onclick="nextPage()">Next ➡</button>
<button class="upload" onclick="window.print()">⬇ PDF Save Karo</button>
</div>

<script>
let photos=[],current=0;
document.getElementById('upload').addEventListener('change',e=>{
photos=[...e.target.files].map(f=>URL.createObjectURL(f));
current=0; showBook();
});
function showBook(){
if(photos[current]) document.getElementById('page1').innerHTML=`<img src="${photos[current]}">`;
if(photos[current+1]) document.getElementById('page2').innerHTML=`<img src="${photos[current+1]}">`;
}
function nextPage(){ if(current+2<photos.length){current+=2; showBook();} }
function prevPage(){ if(current>=2){current-=2; showBook();} }
</script>
</<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAMAN BROWSER + WEEK CHART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#202124;height:100vh;display:flex;flex-direction:column}
.bar{background:#35363a;padding:10px;display:flex;gap:8px}
.bar input{flex:1;padding:12px 18px;border-radius:24px;border:1px solid #5f6368;background:#202124;color:#fff;outline:none}
.bar button{padding:10px 18px;border-radius:20px;border:none;font-weight:700;cursor:pointer}
.btn-search{background:#8ab4f8}
.btn-chart{background:#81c995}
iframe{flex:1;border:none;background:#fff}
#chartPage{display:none;flex:1;background:#fff;color:#000;padding:20px;overflow:auto}
.item{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="bar">
<input id="search" placeholder="Search karo...">
<button class="btn-search" onclick="go()">Search</button>
<button class="btn-chart" onclick="showChart()">📊 Week Chart</button>
<button class="btn-search" onclick="showBrowser()">🌐 Browser</button>
</div>

<iframe id="view" src="https://www.google.com/search?igu=1"></iframe>

<div id="chartPage">
<h2>📊 Is Hafte Ka Search Chart</h2>
<div id="list"></div>
<button onclick="clearHistory()" style="margin-top:20px;padding:10px 20px;background:red;color:#fff;border:none;border-radius:10px">History Clear</button>
</div>

<script>
let view=document.getElementById('view'), input=document.getElementById('search');
let chartPage=document.getElementById('chartPage');
let history=JSON.parse(localStorage.getItem('chaman_search')||'[]');

function go(){
let q=input.value.trim(); if(!q) return;
history.unshift({q:q, time:new Date().toLocaleString()});
localStorage.setItem('chaman_search', JSON.stringify(history.slice(0,100)));
if(q.includes('.') && !q.includes(' ')){
if(!q.startsWith('http')) q='https://'+q; view.src=q;
}else{ view.src='https://www.google.com/search?q='+encodeURIComponent(q)+'&igu=1'; }
input.value='';
}
function showChart(){
view.style.display='none'; chartPage.style.display='block';
let html='';
history.forEach((h,i)=>{
html+=`<div class="item"><span>${i+1}. ${h.q}</span><span>${h.time}</span></div>`;
});
document.getElementById('list').innerHTML=html||'Abhi tak kuch search nahi kiya!';
}
function showBrowser(){ view.style.display='block'; chartPage.style.display='none'; }
function clearHistory(){ localStorage.removeItem('chaman_search'); history=[]; showChart(); }
input.addEventListener('keydown',e=>{if(e.key==='Enter') go()});
</script>
</body>
</html>
</html>
