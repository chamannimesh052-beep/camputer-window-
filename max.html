<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAMAN AI PRO MAX V3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui;background:#0f0f12;color:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#6a00ff,#ff006a);padding:18px;text-align:center}
header h1{font-size:28px}
.main{display:flex;flex-wrap:wrap;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
.left{flex:1 1 420px;background:#1a1a20;border-radius:16px;padding:16px;border:1px solid #2a2a35}
.right{flex:1 1 280px;background:#1a1a20;border-radius:16px;padding:16px;border:1px solid #2a2a35}
#canvasWrap{position:relative;background:#000;border-radius:12px;min-height:360px;display:flex;align-items:center;justify-content:center;border:2px dashed #333}
#preview{max-width:100%;max-height:70vh;display:none;border-radius:8px}
.upload-btn{display:block;width:100%;background:linear-gradient(135deg,#6a00ff,#9d00ff);color:#fff;padding:14px;border-radius:10px;text-align:center;cursor:pointer;font-weight:700;margin-bottom:12px}
input[type=file]{display:none}
.filter-btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#23232e;color:#fff;cursor:pointer;font-size:12px;margin:4px}
.filter-btn.active{background:#6a00ff}
.action-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.download{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000}
.reset{background:#333;color:#fff}
</style>
</head>
<body>
<header><h1>CHAMAN AI PRO MAX V3 🔥</h1><p>Filters • Text • Crop • Background • 4K Download</p></header>
<div class="main">
<div class="left">
<label class="upload-btn" for="upload">📸 PHOTO UPLOAD KARO</label>
<input type="file" id="upload" accept="image/*">
<div id="canvasWrap"><div id="placeholder">Yahan photo dikhegi</div><img id="preview"><canvas id="canvas" style="display:none"></canvas></div>
<div id="controls" style="display:none;margin-top:12px">
<input type="range" id="brightness" min="0" max="200" value="100"> Brightness<br>
<input type="range" id="contrast" min="0" max="200" value="100"> Contrast<br>
<input type="range" id="saturate" min="0" max="200" value="100"> Saturate
</div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="action-btn reset" id="resetBtn">Reset</button><button class="action-btn download" id="downloadBtn">⬇ Download</button></div>
</div>
<div class="right">
<h3>✨ Filters</h3>
<button class="filter-btn active" data-filter="none">Original</button>
<button class="filter-btn" data-filter="grayscale(100%)">B&W</button>
<button class="filter-btn" data-filter="sepia(100%)">Sepia</button>
<button class="filter-btn" data-filter="contrast(150%) saturate(150%)">Vivid</button>
<button class="filter-btn" data-filter="brightness(1.2) contrast(1.1) saturate(1.3)">Aesthetic</button>
<button class="filter-btn" data-filter="invert(100%)">Invert</button>
<h3 style="margin-top:20px">✍️ Text</h3>
<input type="text" id="textInput" placeholder="CHAMAN EDITZ..." style="width:100%;padding:10px;border-radius:8px;background:#23232e;color:#fff;border:1px solid #333">
<button class="filter-btn" id="addTextBtn" style="width:100%;margin-top:8px">Text Lagao</button>
</div>
</div>
<script>
const upload=document.getElementById('upload'),preview=document.getElementById('preview'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),placeholder=document.getElementById('placeholder'),controls=document.getElementById('controls');
let currentImage=null,currentFilter='none',textLayers=[],baseFilters={brightness:100,contrast:100,saturate:100};
upload.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{preview.src=ev.target.result;preview.style.display='block';placeholder.style.display='none';controls.style.display='block';currentImage=new Image();currentImage.onload=()=>draw();currentImage.src=ev.target.result;};r.readAsDataURL(file);});
function getFilter(){return `brightness(${baseFilters.brightness}%) contrast(${baseFilters.contrast}%) saturate(${baseFilters.saturate}%) ${currentFilter!='none'?currentFilter:''}`;}
function draw(){if(!currentImage)return;canvas.width=currentImage.width;canvas.height=currentImage.height;ctx.filter=getFilter();ctx.drawImage(currentImage,0,0);ctx.filter='none';textLayers.forEach(t=>{ctx.font=`${t.size||40}px Impact`;ctx.fillStyle=t.color||'#fff';ctx.strokeStyle='black';ctx.lineWidth=4;ctx.textAlign='center';ctx.strokeText(t.text,canvas.width/2,canvas.height/2);ctx.fillText(t.text,canvas.width/2,canvas.height/2);});preview.src=canvas.toDataURL();}
['brightness','contrast','saturate'].forEach(id=>{document.getElementById(id).addEventListener('input',e=>{baseFilters[id]=e.target.value;draw();});});
document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;draw();});});
document.getElementById('resetBtn').addEventListener('click',()=>{baseFilters={brightness:100,contrast:100,saturate:100};currentFilter='none';textLayers=[];draw();});
document.getElementById('addTextBtn').addEventListener('click',()=>{const txt=document.getElementById('textInput').value;if(!txt)return; textLayers.push({text:txt}); draw();});
document.getElementById('downloadBtn').addEventListener('click',()=>{const a=document.createElement('a');a.download=`CHAMAN_${Date.now()}.png`;a.href=canvas.toDataURL();a.click();});
</script>
</body>
</html>
