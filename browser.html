<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAMAN BROWSER - Chrome</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#202124;height:100vh;display:flex;flex-direction:column}
.bar{background:#35363a;padding:10px;display:flex;gap:10px;align-items:center}
.bar input{flex:1;padding:12px 20px;border-radius:24px;border:none;outline:none;font-size:16px;background:#202124;color:#fff;border:1px solid #5f6368}
.bar button{padding:10px 20px;border-radius:20px;border:none;background:#8ab4f8;font-weight:700;cursor:pointer}
.tabs{background:#202124;color:#fff;padding:10px;text-align:center;font-weight:700}
iframe{flex:1;border:none;background:#fff}
</style>
</head>
<body>
<div class="tabs">🌐 CHAMAN CHROME BROWSER</div>
<div class="bar">
<input id="search" type="text" placeholder="Google pe search karo ya website likho... ex: youtube.com">
<button onclick="go()">Search</button>
</div>
<iframe id="view" src="https://www.google.com/search?igu=1"></iframe>

<script>
let view=document.getElementById('view');
let input=document.getElementById('search');

function go(){
let q=input.value.trim();
if(!q) return;
if(q.includes('.') && !q.includes(' ')){
if(!q.startsWith('http')) q='https://'+q;
view.src=q;
}else{
view.src='https://www.google.com/search?q='+encodeURIComponent(q)+'&igu=1';
}
}
input.addEventListener('keydown',e=>{if(e.key==='Enter') go()});
</script>
</body>
</html>
